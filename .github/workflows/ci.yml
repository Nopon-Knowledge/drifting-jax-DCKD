name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "jax[cpu]==0.4.37" "numpy<2" einops pytest
      - name: Run deterministic CPU tests
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest -q tests/test_drift_loss.py tests/test_prdc.py
