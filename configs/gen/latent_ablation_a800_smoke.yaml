hsdp_dim: 1

logging:
  project: YOUR_WANDB_PROJECT
  entity: YOUR_WANDB_ENTITY
  use_wandb: false
  log_every_k: 1

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 8
  eval_batch_size: 8
  kwargs:
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: true

optimizer:
  lr_schedule:
    learning_rate: 5.0e-05
    warmup_steps: 1
    lr_schedule: const
    total_steps: 1
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  train_batch_size: 1
  seed: 42
  total_steps: 1
  save_per_step: 1
  keep_last: 1
  keep_every: 1
  eval_per_step: 0
  eval_samples: 0
  pos_per_sample: 1
  neg_per_sample: 1
  positive_bank_size: 8
  negative_bank_size: 32
  forward_dict:
    gen_per_label: 1
    cfg_min: 1.0
    cfg_max: 1.0
    neg_cfg_pw: 1.0
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.2]
  cfg_list: [1.0]
  ema_decay: 0.999
  push_per_step: 8

feature:
  mae_path: "hf://mae_latent_256"
  use_mae: true
  use_convnext: false
