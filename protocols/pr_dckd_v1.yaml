protocol_id: PR-DCKD-EXP-V1
design_frozen_at: "2026-07-28T08:47:05+08:00"
status: design_frozen_before_new_experiment_results
paper_target: Pattern Recognition
project: Drifting-JAX / Density-Calibrated Kernel Drifting

governance:
  primary_hypothesis: >-
    Under matched training seeds and the frozen independent generation stream,
    v4.3 has lower FID than the fixed-kernel configuration selected by this
    protocol's finite development grid.
  primary_metric: FID
  secondary_metrics:
    - IS
    - PRDC_precision
    - PRDC_recall
    - PRDC_density
    - PRDC_coverage
  checkpoint_rule: final EMA at step 30000
  reporting:
    - report every planned metric for every valid run
    - report per-seed values, paired differences, mean, sample SD, median, and range
    - training seed is the experimental unit
    - do not claim statistical significance for n=2 or n=3
    - do not describe generation seeds or images as independent training replicates
  forbidden_after_results:
    - changing a generation seed because of metric values
    - changing a CFG or checkpoint using formal-stream results
    - replacing the frozen fixed-kernel winner
    - dropping a finite but unfavorable scientific result
    - adding or removing formal training seeds after partial unblinding
  technical_retry:
    allowed:
      - scheduler failure
      - corrupt or unreadable artifact
      - insufficient valid sample count
      - NaN or Inf
      - evaluator crash
    rule: same seed, config, checkpoint, generation seed, and evaluator snapshot
    preserve_failed_attempt: true

provenance_gate:
  required_before_reusing_historical_checkpoints: true
  core_files:
    - drift_loss.py
    - train.py
    - main.py
    - memory_bank.py
    - models
    - dataset
  assets:
    - MAE weights
    - VAE weights
    - latent cache identity
    - optimizer and EMA semantics
    - JAX/XLA/CUDA environment
  partial_audit_2026_07_28:
    baseline_seed42: not_proven_retrain_for_fixed_search
    v4_1_seed42: not_proven_not_used_in_formal_factorial
    baseline_seeds_123_2026_3407: pending_final_asset_audit
    v4_1_seeds_123_2026: pending_final_asset_audit
    v4_2_seeds_123_2026: pending_final_asset_audit
    v4_3_seeds_123_2026_3407: pending_final_asset_audit

random_streams:
  fixed_kernel_development:
    train_seed: 42
    generation_seeds: [104729, 130363]
  formal:
    train_seeds: [123, 2026, 3407]
    generation_seed: 271828
  qualitative:
    generation_seed: 314159
  fixed_eval_batch_size: 128
  fixed_vae_decode_batch_size: 32
  require_frozen_label_manifest: true

evaluation:
  formal_num_samples: 50000
  development_num_samples: 10000
  feature_extractor: frozen project Inception implementation and weights
  one_generation_per_cell: true
  reuse_same_samples_for_all_metrics: true
  retain:
    - generated Inception features
    - logits
    - labels
    - sample or chunk hashes
    - result JSON
    - run manifest
  prdc:
    nearest_k: 5
    squared_euclidean: true
    exact_search: true
    exclude_self_neighbor: true
    preferred_num_samples: 50000
    fallback:
      num_samples: 10000
      balanced_per_class: 10
      must_freeze_indices_before_formal_results: true

main_independent_stream:
